name: Ohana Vision
environment: production
debug: false

server:
  host: 0.0.0.0
  port: 8000
  log_level: info

web:
  documentation_enabled: false

storage:
  database_path: /var/lib/ohana-vision/vision.db
  retention_days: 2
  purge_interval_seconds: 3600
  history_max_rows: 50000

agent:
  administration_enabled: true
  administration_url: http://127.0.0.1:8765
  token_file: /etc/ohana-vision/management.token
  timeout_seconds: 10.0
  companion_enabled: true
  companion_url: https://infra-01.ohana.lan:8767
  companion_ca_file: /etc/ohana-vision/companion-ca.crt
